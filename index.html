<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="google-site-verification" content="_H93F-TGCmDhEX6OKtTU-m6UI8yCzduvvSAqCjVGSxg" />
<title>굿박스 - 무료 웹 도구 모음</title>
<meta name="description" content="설치 없이 바로 쓰는 무료 웹 도구 모음. N빵 계산기, 몸무게 기록, 키워드 검색량 체커, 연락처 변환기, 영유아 성장 백분위 계산기.">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 40px 16px 56px;
    min-height: 100vh;
    background: linear-gradient(180deg, #4A90E2 0%, #F2F5F9 280px);
    font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #222;
  }
  .container { max-width: 520px; margin: 0 auto; }
  .brand {
    text-align: center;
    color: #fff;
    font-size: 1.05rem;
    font-weight: bold;
    letter-spacing: 0.06em;
    opacity: 0.85;
    margin-bottom: 6px;
  }
  h1 {
    text-align: center;
    color: #fff;
    font-size: 1.6rem;
    margin: 0 0 32px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .grid a.tile:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }
  .grid a.tile:last-child:nth-child(odd) .icon {
    aspect-ratio: auto;
    height: 64px;
  }
  a.tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    border-radius: 20px;
    padding: 22px 14px;
    text-decoration: none;
    color: #222;
    box-shadow: 0 4px 14px rgba(0,0,0,0.10);
    transition: transform 0.08s ease;
    text-align: center;
  }
  a.tile:active { transform: scale(0.96); background: #F7FAFF; }
  .icon {
    width: 100%;
    aspect-ratio: 1.6 / 1;
    max-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.1rem;
  }
  .tile .name {
    font-size: 1.02rem;
    font-weight: bold;
    line-height: 1.3;
  }
  .tile .desc {
    font-size: 0.78rem;
    color: #888;
    line-height: 1.35;
  }
  footer {
    text-align: center;
    color: #999;
    font-size: 0.78rem;
    margin-top: 40px;
  }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9634919146453835" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
  <div class="brand">GOODBOX</div>
  <h1>🧰 무료 웹 도구 모음</h1>

  <div class="grid">

    <a class="tile" href="/nbbang-calculator/">
      <div class="icon">🧮</div>
      <div class="name">N빵 계산기</div>
      <div class="desc">여행·회식 정산 자동 계산</div>
    </a>

    <a class="tile" href="/growth-calculator/">
      <div class="icon">👶</div>
      <div class="name">성장 백분위 계산기</div>
      <div class="desc">우리 아이 키·몸무게 또래 비교</div>
    </a>

    <a class="tile" href="/vcard-converter/">
      <div class="icon">📇</div>
      <div class="name">연락처 변환기</div>
      <div class="desc">vCard ↔ 엑셀 상호 변환</div>
    </a>

    <a class="tile" href="/weight-tracker/">
      <div class="icon">⚖️</div>
      <div class="name">몸무게 기록 그래프</div>
      <div class="desc">날짜별 몸무게 그래프 자동 기록</div>
    </a>

    <a class="tile" href="/keyword-checker/">
      <div class="icon">🔍</div>
      <div class="name">키워드 검색량 체커</div>
      <div class="desc">네이버 월간 검색량 바로 확인</div>
    </a>

  </div>

  <footer>goodboxkr.github.io</footer>
</div>
</body>
</html>
